<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صياد السمك | Fishing Adventure</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dff4ff;--fg:#0b2a44;--cd:#ffffff;--cd2:#f0f9ff;--ac:#0a84c6;--ac2:#065f92;--gd:#f5b301;--ok:#16a34a;--bad:#dc2626;--bd:rgba(10,132,198,.22)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#061e33;--fg:#e6f6ff;--cd:#0d3554;--cd2:#114266;--ac:#37b4f0;--ac2:#1d8cc4;--bd:rgba(55,180,240,.25)
  }
}
:root[data-theme="dark"]{
  --bg:#061e33;--fg:#e6f6ff;--cd:#0d3554;--cd2:#114266;--ac:#37b4f0;--ac2:#1d8cc4;--bd:rgba(55,180,240,.25)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 15px;cursor:pointer;margin:3px;font-weight:600;transition:transform .12s,background .15s,opacity .15s}
button:hover{background:var(--ac2)}
button:active{transform:scale(.96)}
button[disabled]{opacity:.45;cursor:not-allowed}
button.sec{background:var(--cd2);color:var(--fg);border:1px solid var(--bd)}
button.ok{background:var(--ok);color:#fff}
button.bad{background:var(--bad);color:#fff}
button.gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
select,input[type="text"],input[type="number"],input[type="password"],textarea{
  background:var(--cd2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px
}
input[type="range"]{accent-color:var(--ac);cursor:pointer}

/* Start Screen */
#start{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;background:linear-gradient(180deg,#7dd3fc 0%,#0284c7 55%,#06203a 100%);
  color:#fff;overflow:hidden;position:relative
}
#start h1{font-size:2.5rem;margin:.2em 0;text-shadow:0 4px 12px rgba(0,0,0,.35)}
.sw{position:absolute;font-size:2.2rem;animation:swim 11s linear infinite;opacity:.85;pointer-events:none}
@keyframes swim{from{left:-12%}to{left:112%}}
.dev{margin:10px 0 18px;font-weight:700;background:rgba(0,0,0,.22);padding:8px 18px;border-radius:20px}
.dev small{display:block;opacity:.9;font-weight:500}

/* App Shell */
#app{max-width:980px;margin:auto;padding:10px}
#top{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;margin-bottom:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.06)
}
.hud-pill{
  display:inline-flex;align-items:center;gap:5px;background:var(--cd2);padding:5px 10px;
  border-radius:12px;font-weight:700;font-size:.92rem;border:1px solid var(--bd)
}
.icon-btn{padding:5px 10px;margin:0;border-radius:10px;font-size:.9rem}
#tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
#tabs button{white-space:nowrap;background:var(--cd);color:var(--fg);border:1px solid var(--bd);margin:0}
#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.box{
  background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:13px;margin:8px 0;
  box-shadow:0 4px 14px rgba(0,0,0,.05)
}
canvas{width:100%;max-width:100%;border-radius:16px;display:block;touch-action:manipulation;box-shadow:0 6px 20px rgba(0,0,0,.18)}

/* Depth & Controls Bar */
.ctrl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:4px}
.depth-panel{
  flex:1 1 320px;background:var(--cd2);border:1px solid var(--bd);border-radius:12px;padding:8px 12px
}
.depth-head{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;font-weight:700;margin-bottom:4px}
.depth-panel input[type="range"]{width:100%}
.gear-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:.85rem}
.gear-badge{background:var(--cd2);border:1px solid var(--bd);border-radius:10px;padding:4px 9px;font-weight:600}
.gear-badge.warn{border-color:var(--bad);color:var(--bad)}

/* Grids & Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.card{
  background:var(--cd);border-radius:16px;padding:12px;text-align:center;
  border:2px solid var(--bd);display:flex;flex-direction:column;justify-content:space-between;gap:4px
}
.card.equipped{border-color:var(--ok);box-shadow:0 0 0 2px rgba(22,163,74,.2)}
.card.dim{opacity:.55}
.card small{display:block;opacity:.85;font-size:.82rem}
.cover{font-size:2.3rem}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.subtabs button{background:var(--cd2);color:var(--fg);border:1px solid var(--bd)}
.subtabs button.on{background:var(--ac);color:#fff}

.chip{display:inline-block;margin:3px;padding:7px 12px;border-radius:20px;border:2px solid var(--ac);cursor:pointer;background:var(--cd);font-size:.9rem}
.chip.on{background:var(--ac);color:#fff}

/* Rarity Borders */
.r0{border-color:#94a3b8}
.r1{border-color:#22c55e}
.r2{border-color:#3b82f6}
.r3{border-color:#a855f7}
.r4{border-color:#f59e0b;box-shadow:0 0 14px rgba(245,158,11,.45)}

/* Question Bank List */
.qb-list{max-height:380px;overflow-y:auto;border:1px solid var(--bd);border-radius:12px;padding:6px;background:var(--cd2)}
.qb-item{
  display:flex;align-items:flex-start;gap:8px;padding:8px;border-bottom:1px solid var(--bd);
  background:var(--cd);border-radius:10px;margin-bottom:6px
}
.qb-item:last-child{margin-bottom:0}
.qb-item input[type="checkbox"]{width:18px;height:18px;margin-top:3px;accent-color:var(--ac);cursor:pointer}
.qb-meta{font-size:.8rem;opacity:.8;margin-top:2px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
@media(max-width:560px){.opt-grid{grid-template-columns:1fr}}
.opt-row{display:flex;align-items:center;gap:6px}
.opt-row input[type="text"]{flex:1}
.cat-bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.cat-chip{padding:6px 12px;border-radius:18px;border:1.5px solid var(--ac);background:var(--cd);color:var(--fg);cursor:pointer;font-size:.86rem;font-weight:600;transition:.15s}
.cat-chip.on{background:var(--ac);color:#fff}
.ocean-stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:.8rem;margin-top:4px;padding-top:4px;border-top:1px dashed var(--bd)}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:30;backdrop-filter:blur(2px)}
#modal[hidden],[hidden]{display:none!important}
#mbox{background:var(--cd);color:var(--fg);border-radius:18px;padding:18px;max-width:500px;width:100%;max-height:90vh;overflow:auto;animation:pop .22s;border:1px solid var(--bd)}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
.o{display:block;width:100%;text-align:start;margin:7px 0;padding:11px 14px;border-radius:12px;font-size:1rem}
.q{font-size:1.15rem;font-weight:700;line-height:1.5;margin-top:0}
textarea{width:100%}
</style>
</head>

<div id="start">
  <span class="sw" style="top:16%">🐠</span>
  <span class="sw" style="top:42%;animation-delay:-4s">🐟</span>
  <span class="sw" style="top:68%;animation-delay:-7s">🦈</span>
  <div style="font-size:4.2rem">🚤🎣</div>
  <h1 id="ti"></h1>
  <div class="dev" id="dv"></div>
  <div>
    <button id="s-go" class="gold" style="font-size:1.1rem;padding:12px 24px"></button>
    <button id="s-qb"></button>
    <button id="s-lib"></button>
    <button id="s-ab" class="sec"></button>
  </div>
  <div id="s-lg" style="margin-top:12px"></div>
</div>

<div id="app" hidden>
  <div id="top"></div>
  <div id="tabs"></div>

  <div id="fishsec">
    <canvas id="cv" width="720" height="410"></canvas>
    <div class="box">
      <div class="ctrl-row">
        <div>
          <button id="bc" style="font-size:1.05rem;padding:11px 20px"></button>
          <button id="bswitch" class="sec"></button>
        </div>
        <div class="depth-panel">
          <div class="depth-head">
            <span id="dp-lbl"></span>
            <span id="dp-val" style="color:var(--ac)"></span>
          </div>
          <input id="dp-sl" type="range" min="5" max="20" step="5" value="15">
          <div style="display:flex;justify-content:space-between;font-size:.78rem;opacity:.85;margin-top:2px">
            <span id="dp-unl"></span>
            <span id="dp-cap"></span>
          </div>
          <div class="ocean-stats">
            <span id="oc-zone" style="font-weight:700;color:var(--ac)"></span>
            <span id="oc-width"></span>
            <span id="oc-rare" style="color:var(--gd);font-weight:700"></span>
          </div>
        </div>
      </div>
      <div id="hint" style="margin:8px 0 4px;font-weight:700;color:var(--ac)"></div>
      <div class="gear-strip" id="gear-strip"></div>
    </div>
  </div>

  <div id="sec" hidden></div>
</div>

<div id="modal" hidden><div id="mbox"></div></div>

/* ---------- Audio ---------- */
let AC;
function bp(f,d=.1,ty='sine'){
  if(!S.vol)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=ty;o.frequency.value=f;
    g.gain.setValueAtTime(S.vol*.18,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
function sfx(type){
  if(type==='cast'){bp(320,.12,'sine');setTimeout(()=>bp(220,.16,'triangle'),70)}
  else if(type==='bite'){bp(520,.1,'triangle');setTimeout(()=>bp(680,.14,'triangle'),90)}
  else if(type==='win'){bp(523,.1);setTimeout(()=>bp(659,.1),90);setTimeout(()=>bp(784,.22),180)}
  else if(type==='bad'){bp(210,.18,'sawtooth');setTimeout(()=>bp(155,.25,'sawtooth'),130)}
  else if(type==='snap'){bp(140,.12,'square');setTimeout(()=>bp(95,.28,'sawtooth'),80)}
  else if(type==='coin'){bp(880,.08);setTimeout(()=>bp(1175,.15),70)}
}

/* ---------- Standalone Question Bank View ---------- */
function parseBulkQuestions(raw){
  const text=raw.trim();
  if(!text)return[];
  if(text.startsWith('[')||text.startsWith('{')){
    try{
      const data=JSON.parse(text);
      const arr=Array.isArray(data)?data:(data.questions||[]);
      return arr.map((item,idx)=>{
        const q=String(item.q||item.question||'').trim();
        const o=Array.isArray(item.o||item.options)?(item.o||item.options).map(String):[];
        const a=typeof item.a==='number'?item.a:0;
        if(q&&o.length>=2)return{id:'qb_'+Date.now()+'_'+idx+'_'+Math.random().toString(36).slice(2,5),q,o,a:Math.max(0,Math.min(o.length-1,a)),cat:String(item.cat||'').trim()};
        return null;
      }).filter(Boolean);
    }catch(e){}
  }

  const out=[];
  const lines=text.split(/\r?\n/).map(l=>l.trim());
  const pipeLines=lines.filter(l=>l.includes('|'));
  if(pipeLines.length>=1&&pipeLines.length>=lines.filter(Boolean).length*0.5){
    pipeLines.forEach((line,idx)=>{
      const parts=line.split('|').map(p=>p.trim()).filter(Boolean);
      if(parts.length>=3){
        const qText=parts[0].replace(/^[\d٠-٩]+[\.\-\)\:]\s*/,'');
        let ansIdx=0;
        const opts=parts.slice(1).map((opt,oi)=>{
          if(/[\*✔✓]|\(صح\)|\(صحيح\)/.test(opt)){
            ansIdx=oi;
            return opt.replace(/[\*✔✓]|\(صح\)|\(صحيح\)/g,'').trim();
          }
          return opt;
        });
        out.push({id:'qb_'+Date.now()+'_'+idx+'_'+Math.random().toString(36).slice(2,5),q:qText,o:opts,a:ansIdx,cat:''});
      }
    });
    if(out.length)return out;
  }

  const blocks=[];
  let curB=[];
  for(const line of lines){
    if(!line){
      if(curB.length){blocks.push(curB);curB=[];}
    }else{
      if(curB.length>=3&&/^([\d٠-٩]+[\.\-\)\:]|س\s*[\d٠-٩]*[\:\-])/.test(line)){
        blocks.push(curB);curB=[line];
      }else{
        curB.push(line);
      }
    }
  }
  if(curB.length)blocks.push(curB);

  blocks.forEach((blk,idx)=>{
    if(blk.length<3)return;
    const qText=blk[0].replace(/^([\d٠-٩]+[\.\-\)\:]|س\s*[\d٠-٩]*[\:\-])\s*/,'').trim();
    let ansIdx=0;
    const opts=[];
    for(let i=1;i<blk.length;i++){
      let ln=blk[i];
      if(/^(الإجابة|الجواب|الصواب|Answer)\s*[\:\-]/i.test(ln)){
        const val=ln.replace(/^(الإجابة|الجواب|الصواب|Answer)\s*[\:\-]/i,'').trim();
        const letterMap={'أ':0,'ا':0,'A':0,'a':0,'1':0,'ب':1,'B':1,'b':1,'2':1,'ج':2,'C':2,'c':2,'3':2,'د':3,'D':3,'d':3,'4':3};
        if(val[0] in letterMap)ansIdx=Math.min(opts.length-1,letterMap[val[0]]);
        continue;
      }
      const hasStar=/[\*✔✓]|\(صح\)|\(صحيح\)/.test(ln);
      ln=ln.replace(/^([أابجدهـA-Da-d1-4][\)\.\-\:]|[\-\•])\s*/,'').replace(/[\*✔✓]|\(صح\)|\(صحيح\)/g,'').trim();
      if(ln){
        if(hasStar)ansIdx=opts.length;
        opts.push(ln);
      }
    }
    if(qText&&opts.length>=2){
      out.push({id:'qb_'+Date.now()+'_'+idx+'_'+Math.random().toString(36).slice(2,5),q:qText,o:opts,a:Math.max(0,Math.min(opts.length-1,ansIdx)),cat:''});
    }
  });
  return out;
}

function vBank(){
  const allCats=[...new Set([...S.cats,...S.bank.map(q=>q.cat).filter(Boolean)])];
  const filtered=S.bank.filter(q=>{

/* ---------- Book Library View ---------- */
function vLib(){
  const bs=allB();
  let o='<h2>📚 '+t('lb')+'</h2>';
  if(S.sub&&S.book){
    const b=bs.find(x=>x.id===S.book);
    o+='<div class="box"><h3>'+t('pk')+'</h3><b>'+esc(b.n)+'</b> — '+b.p+' '+t('pg')+'<div style="margin:8px 0">';
    for(let a=1,i=0;a<=b.p;a+=50,i++){
      const e=Math.min(a+49,b.p),qs=allQ().filter(q=>q.b===b.id&&q.p>=a&&q.p<=e),sn=qs.filter(q=>S.seen.includes(q.id)).length,on=S.rs.some(r=>r[0]===a&&r[1]===e);
      o+='<span class="chip '+(on?'on':'')+'" data-a="'+a+'" data-e="'+e+'">'+t('pt')+' '+(i+1)+': '+a+'–'+e+' · '+qs.length+' '+t('qn')+' · '+(qs.length?Math.round(100*sn/qs.length):0)+'%</span>';
    }
    o+='</div><h4>'+t('cu')+'</h4><input id="ca" type="number" min="1" max="'+b.p+'" placeholder="'+t('fr')+'" style="width:40%"> <input id="ce" type="number" min="1" max="'+b.p+'" placeholder="'+t('to')+'" style="width:40%"> <button id="cadd">'+t('ad')+'</button>'+
       '<div style="margin-top:10px"><button id="gt" class="gold">'+t('go')+'</button> <button id="bk" class="sec">←</button></div>';
    if(S.rs.length)o+='<p>'+S.rs.map(r=>r[0]+'–'+r[1]).join(' , ')+'</p>';
    o+='</div>';
    return o;
  }
  o+='<div class="grid">'+Array.from({length:5},(_,i)=>{
    const b=bs[i];
    if(!b)return'<div class="card dim"><div class="cover">📕</div><b>—</b><small>'+t('emp')+'</small></div>';
    const n=allQ().filter(q=>q.b===b.id).length,s=allQ().filter(q=>q.b===b.id&&S.seen.includes(q.id)).length;
    return'<div class="card"><div class="cover">📗</div><b>'+esc(b.n)+'</b><small>'+esc(b.a)+'</small><small>'+b.p+' '+t('pg')+' · '+n+' '+t('qn')+' · '+(n?Math.round(100*s/n):0)+'%</small><button data-bk="'+b.id+'">'+t('pb')+'</button></div>';
  }).join('')+'</div>';
  return o;
}

/* ---------- Event Binding ---------- */
function bind(){
  const q=(s,fn)=>document.querySelectorAll(s).forEach(fn);

  q('.cat-chip',c=>c.onclick=()=>{
    S.activeCat=c.dataset.cat||'';
    save();show('qb');
  });
  const qbAddCat=$('#qb-addcat');
  if(qbAddCat)qbAddCat.onclick=()=>{
    const nc=$('#qb-newcat').value.trim();
    if(!nc)return msg(t('inv'));
    if(!S.cats.includes(nc))S.cats.push(nc);
    S.activeCat=nc;
    save();show('qb');
  };
  const qbUseCat=$('#qb-usecat');
  if(qbUseCat)qbUseCat.onclick=()=>{
    if(!S.activeCat)return;
    const ids=S.bank.filter(x=>x.cat===S.activeCat).map(x=>x.id);
    if(!ids.length)return msg(t('nq'));
    S.bankSel=ids;S.bankDone=[];S.mode='bank';S.review=false;
    save();show('fish');
  };
  const qbRestore=$('#qb-restore');
  if(qbRestore)qbRestore.onclick=()=>{
    const existingIds=new Set(S.bank.map(x=>x.id));
    INIT_BANK.forEach(item=>{
      if(!existingIds.has(item.id)){
        S.bank.push({...item,o:[...item.o]});
        if(!S.bankSel.includes(item.id))S.bankSel.push(item.id);
        if(item.cat&&!S.cats.includes(item.cat))S.cats.push(item.cat);
      }
    });
    S.bankDone=[];save();
    msg('✅ '+S.bank.length+' '+t('qn'),()=>show('qb'));
  };

  const qbAdd1=$('#qb-add1');
  if(qbAdd1)qbAdd1.onclick=()=>{
    const qt=$('#qb-q').value.trim();
    const rad=document.querySelector('input[name="qb-cor"]:checked');
    const rawIdx=rad?+rad.value:0;
    const rawOpts=[0,1,2,3].map(i=>({txt:$('#qb-o'+i).value.trim(),cor:i===rawIdx})).filter(x=>x.txt);
    if(!qt||rawOpts.length<2)return msg(t('inv'));
    const opts=rawOpts.map(x=>x.txt);
    const foundCor=rawOpts.findIndex(x=>x.cor);
    const ans=foundCor>=0?foundCor:0;
    const cat=$('#qb-cat').value.trim()||S.activeCat||'عام';
    if(!S.cats.includes(cat))S.cats.push(cat);
    const id='qb_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
    S.bank.unshift({id,q:qt,o:opts,a:ans,cat});
    S.bankSel.push(id);
    save();show('qb');
  };
  const qbBulk=$('#qb-bulk-btn');
  if(qbBulk)qbBulk.onclick=()=>{
    const parsed=parseBulkQuestions($('#qb-bulk-txt').value);
    if(!parsed.length)return msg(t('inv'));
    const cat=($('#qb-bulk-cat')?$('#qb-bulk-cat').value.trim():'')||S.activeCat||'عام';
    if(!S.cats.includes(cat))S.cats.push(cat);
    parsed.forEach(item=>{
      item.cat=cat;
      S.bank.unshift(item);
      S.bankSel.push(item.id);
    });
    save();
    msg('✅ '+parsed.length+' '+t('qn')+' ['+esc(cat)+']',()=>show('qb'));
  };
  const qbSample=$('#qb-sample');
  if(qbSample)qbSample.onclick=()=>{
    $('#qb-bulk-txt').value=
      'ما علامة رفع جمع المذكر السالم؟ | الواو* | الألف | الضمة | ثبوت النون\n'+
      'كم عدد مخارج الحروف الرئيسية؟ | خمسة* | ثلاثة | سبعة | أربعة\n'+

/* ---------- Questions & Streamlined Catch Flow ---------- */
function nextQ(){
  const p=activePool();
  if(!p.length)return{e:'nq'};
  if(S.mode==='bank'){
    if(S.review){
      const rw=p.filter(q=>S.wrong.includes(q.id));
      if(rw.length){
        const chosen=rw[Math.floor(Math.random()*rw.length)];
        lastQId=chosen.id;
        return{q:chosen};
      }
      S.review=false;
    }
    let rem=p.filter(q=>!S.bankDone.includes(q.id));
    if(!rem.length){
      S.bankDone=[];
      rem=p;
    }
    const noRepeat=rem.length>1?rem.filter(q=>q.id!==lastQId):rem;
    const chosen=noRepeat[Math.floor(Math.random()*noRepeat.length)];
    lastQId=chosen.id;
    return{q:chosen};
  }
  const c=S.review?p.filter(q=>S.wrong.includes(q.id)):p.filter(q=>!S.seen.includes(q.id));
  if(!c.length){
    if(S.review&&S.wrong.length===0){
      S.review=false;
      const fresh=p.filter(q=>!S.seen.includes(q.id));
      if(fresh.length)return{q:fresh[Math.floor(Math.random()*fresh.length)]};
    }
    return{e:'cm'};
  }
  return{q:c[Math.floor(Math.random()*c.length)]};
}

function showQ(q){
  if(!q||!tgt){ph='idle';tgt=null;return;}
  if(!S.seen.includes(q.id))S.seen.push(q.id);
  if(S.mode==='bank'&&!S.bankDone.includes(q.id))S.bankDone.push(q.id);
  save();
  const dir=/[\u0600-\u06FF]/.test(q.q)?'rtl':'ltr';
  $('#mbox').innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.85rem;opacity:.85">'+
      '<span>🐠 <b>'+esc(fname(tgt.f))+'</b> ('+tgt.f[3]+' kg · '+RAR[S.lang][tgt.f[8]]+')</span>'+
      '<span>'+(q.cat?'📁 '+esc(q.cat)+' · ':'')+'🌊 '+S.targetDepth+' m</span>'+
    '</div>'+
    '<p class="q" dir="'+dir+'">'+esc(q.q)+'</p>'+
    q.o.map((o,i)=>'<button class="o" dir="'+dir+'" data-i="'+i+'">'+esc(o)+'</button>').join('');
  open();
  document.querySelectorAll('.o').forEach(b=>b.onclick=()=>answer(q,+b.dataset.i));
}

function answer(q,i){
  S.ans++;
  close();
  if(i===q.a){
    S.right++;
    S.wrong=S.wrong.filter(x=>x!==q.id);
    let coinMult=1,xpMult=1;
    if(S.rod===1)xpMult+=.05;
    if(S.rod===2)coinMult+=.10;
    if(S.rod===4)xpMult+=.15;
    if(S.rod===6)coinMult+=.20;
    if(S.rod===8){coinMult+=.30;xpMult+=.30;}
    if(hasAcc('reel'))coinMult+=.15;

    const earnedCoins=Math.round((4+tgt.f[9]*0.2)*coinMult);
    const earnedXp=Math.round((8+tgt.f[8]*8)*xpMult);
    S.coins+=earnedCoins;
    S.xp+=earnedXp;
    S.unlockedDepth=Math.min(500,S.unlockedDepth+25);
    sfx('win');
    save();drawTop();syncDepthUI();
    ph='reeling';
    banner='✅ +'+earnedCoins+' 🪙 · +25m 🌊';
    bannerT=140;
  }else{
    if(!S.wrong.includes(q.id))S.wrong.push(q.id);
    sfx('bad');
    save();
    ph='flee';
    tgt.d=tgt.x<hx?-1:1;
    msg('❌ <b>'+t('no')+'</b><br>'+t('ex')+': <b style="color:var(--ok)">'+esc(q.o[q.a])+'</b>');
  }
}

function pickTargetFish(depth){
  const maxW=effMaxWeight();
  const inZone=fishPoolForDepth(depth);
  const catchable=inZone.filter(f=>f[3]<=maxW);
  const pool=(catchable.length&&Math.random()<.85)?catchable:inZone;
  const w=[];
  pool.forEach(f=>{
    const r=f[8];
    let wt=1;
    if(r===0)wt=Math.max(1,Math.round(7-depth/65));
    else if(r===1)wt=Math.max(1,Math.round(5-depth/115));
    else if(r===2)wt=Math.round(2+depth/50);
    else if(r===3)wt=Math.round(1+depth/42+(hasAcc('light')?3:0));
    else wt=Math.round(1+depth/36+(hasAcc('light')?4:0));
    for(let i=0;i<wt;i++)w.push(f);
  });
  return w[Math.floor(Math.random()*w.length)];
}

/* ---------- Realistic 3D-Shaded Anatomical Fish Renderer ---------- */
function drawFish3D(f,x,y,dir,scaleMult=1,time=0){
  const id=f[0],len=f[4],c1=f[10],c2=f[11];
  const baseR=(11+Math.min(36,Math.log(len+2)*5.5))*scaleMult;
  const wag=Math.sin(time*7+x*0.03)*0.24;

  cx.save();
  cx.translate(x,y);
  cx.scale(dir,1);

  /* Custom Anatomical Silhouettes for Special Marine Creatures */
  if(id==='octopus'||id==='squid'){
    // Animated trailing tentacles
    for(let ti=-2;ti<=2;ti++){
      const wave=Math.sin(time*6+ti*1.1)*6*scaleMult;
      cx.strokeStyle=c1;
      cx.lineWidth=(id==='squid'?2.6:3.4)*scaleMult;
      cx.lineCap='round';
      cx.beginPath();
      cx.moveTo(-baseR*0.4,ti*baseR*0.24);
      cx.quadraticCurveTo(-baseR*1.3,ti*baseR*0.35+wave,-baseR*2.05,ti*baseR*0.45-wave);
      cx.stroke();
    }
    const mg=cx.createLinearGradient(0,-baseR,0,baseR);
    mg.addColorStop(0,c1);mg.addColorStop(1,c2);
    cx.fillStyle=mg;
    cx.beginPath();
    if(id==='squid'){
      cx.moveTo(baseR*1.5,0);
      cx.lineTo(baseR*0.75,-baseR*0.75);
      cx.lineTo(-baseR*0.65,-baseR*0.48);
      cx.lineTo(-baseR*0.65,baseR*0.48);
      cx.lineTo(baseR*0.75,baseR*0.75);
      cx.closePath();
    }else{
      cx.ellipse(baseR*0.25,0,baseR*1.05,baseR*0.78,0,0,Math.PI*2);
    }
    cx.fill();
    cx.fillStyle='#ffffff';cx.beginPath();cx.arc(baseR*0.35,-baseR*0.22,baseR*0.22,0,Math.PI*2);cx.fill();
    cx.fillStyle='#0f172a';cx.beginPath();cx.arc(baseR*0.4,-baseR*0.22,baseR*0.12,0,Math.PI*2);cx.fill();
    cx.restore();
    return;
  }

  if(id==='manta'){
    const flap=Math.sin(time*4.5)*baseR*0.45;
    cx.strokeStyle=c1;cx.lineWidth=2.2*scaleMult;
    cx.beginPath();cx.moveTo(-baseR*0.8,0);cx.quadraticCurveTo(-baseR*1.6,flap*0.3,-baseR*2.3,-flap*0.2);cx.stroke();
    const mg=cx.createLinearGradient(0,-baseR,0,baseR);
    mg.addColorStop(0,c1);mg.addColorStop(1,c2);
    cx.fillStyle=mg;
    cx.beginPath();
    cx.moveTo(baseR*1.1,0);
    cx.quadraticCurveTo(baseR*0.1,-baseR*1.65+flap,-baseR*0.95,-baseR*0.25);
    cx.quadraticCurveTo(-baseR*0.4,0,-baseR*0.95,baseR*0.25);
    cx.quadraticCurveTo(baseR*0.1,baseR*1.65-flap,baseR*1.1,0);
    cx.fill();
    cx.fillStyle='#fff';cx.beginPath();cx.arc(baseR*0.65,-baseR*0.18,baseR*0.14,0,Math.PI*2);cx.fill();
    cx.restore();
    return;
  }

  if(id==='oarfish'||id==='moray'||id==='leviathan'){
    const segs=12,step=baseR*0.36;
    cx.lineCap='round';
    for(let s=segs;s>=0;s--){
      const sx=(segs/2-s)*step;
      const sy=Math.sin(time*5.5-s*0.65)*baseR*0.28;
      const rad=baseR*(0.42-s*0.022);
      cx.fillStyle=s%2===0?c1:c2;
      cx.beginPath();cx.arc(sx,sy,Math.max(2,rad),0,Math.PI*2);cx.fill();
      if(id==='oarfish'||id==='leviathan'){
        cx.strokeStyle=id==='oarfish'?'#ef4444':'#fde047';
        cx.lineWidth=1.8*scaleMult;
        cx.beginPath();cx.moveTo(sx,sy-rad);cx.lineTo(sx-2,sy-rad-baseR*0.38);cx.stroke();
      }
    }
    const hx2=(segs/2)*step,hy2=Math.sin(time*5.5)*baseR*0.28;
    cx.fillStyle='#fff';cx.beginPath();cx.arc(hx2+baseR*0.15,hy2-baseR*0.1,baseR*0.18,0,Math.PI*2);cx.fill();
    cx.fillStyle='#0f172a';cx.beginPath();cx.arc(hx2+baseR*0.18,hy2-baseR*0.1,baseR*0.09,0,Math.PI*2);cx.fill();
    cx.restore();
    return;
  }

  let rx=baseR*1.65,ry=baseR*0.62;
  if(id==='barracuda'){rx=baseR*2.35;ry=baseR*0.42;}
  else if(id==='sardine'||id==='mack'||id==='mullet'){rx=baseR*1.9;ry=baseR*0.48;}
  else if(id==='sword'||id==='marlin'){rx=baseR*1.95;ry=baseR*0.56;}
  else if(id==='shark'||id==='hammerhead'||id==='orca'){rx=baseR*2.15;ry=baseR*0.64;}
  else if(id==='mola'){rx=baseR*1.15;ry=baseR*1.18;}
  else if(id==='clown'||id==='bream'||id==='tilapia'||id==='butterfly'||id==='tang'){rx=baseR*1.42;ry=baseR*0.76;}
  else if(id==='angler'){rx=baseR*1.35;ry=baseR*0.88;}

  // 1. Animated Tail Fin
  cx.save();
  cx.translate(-rx*0.88,0);
  cx.rotate(wag);
  cx.fillStyle=id==='tang'?'#facc15':c1;
  cx.beginPath();
  if(id==='mola'){
    cx.moveTo(0,-ry*0.75);
    cx.quadraticCurveTo(-baseR*0.45,-ry*0.35,-baseR*0.32,0);
    cx.quadraticCurveTo(-baseR*0.45,ry*0.35,0,ry*0.75);
  }else if(id==='shark'||id==='hammerhead'){
    cx.moveTo(0,-ry*0.35);
    cx.lineTo(-baseR*1.15,-ry*1.25);
    cx.lineTo(-baseR*0.6,0);
    cx.lineTo(-baseR*0.95,ry*0.9);
    cx.lineTo(0,ry*0.35);
  }else if(id==='tuna'||id==='sword'||id==='marlin'||id==='mack'){
    cx.moveTo(0,-ry*0.3);
    cx.lineTo(-baseR*1.05,-ry*1.05);
    cx.lineTo(-baseR*0.55,0);
    cx.lineTo(-baseR*1.05,ry*1.05);
    cx.lineTo(0,ry*0.3);
  }else{
    cx.moveTo(0,-ry*0.35);
    cx.quadraticCurveTo(-baseR*0.95,-ry*0.95,-baseR*0.85,0);
    cx.quadraticCurveTo(-baseR*0.95,ry*0.95,0,ry*0.35);
  }
  cx.closePath();
  cx.fill();
  cx.restore();

  // 2. Dorsal & Anal Fins
  cx.fillStyle=c1;
  if(id==='shark'||id==='hammerhead'||id==='orca'){
    cx.beginPath();
    cx.moveTo(-rx*0.15,-ry*0.85);
    cx.lineTo(rx*0.05,-ry*1.95);
    cx.lineTo(rx*0.32,-ry*0.82);
    cx.closePath();cx.fill();
  }else if(id==='sword'||id==='marlin'){
    cx.beginPath();
    cx.moveTo(-rx*0.2,-ry*0.85);
    cx.quadraticCurveTo(rx*0.25,-ry*(id==='marlin'?2.2:1.9),rx*0.48,-ry*0.8);
    cx.closePath();cx.fill();
  }else if(id==='mola'){
    cx.beginPath();
    cx.moveTo(-rx*0.2,-ry*0.88);cx.lineTo(-rx*0.05,-ry*1.85);cx.lineTo(rx*0.25,-ry*0.88);cx.fill();
    cx.beginPath();
    cx.moveTo(-rx*0.2,ry*0.88);cx.lineTo(-rx*0.05,ry*1.85);cx.lineTo(rx*0.25,ry*0.88);cx.fill();
  }else if(id==='lion'){
    for(let s=-4;s<=3;s++){
      cx.strokeStyle=s%2===0?c1:'#fff3e0';
      cx.lineWidth=2.4*scaleMult;
      cx.beginPath();
      cx.moveTo(s*rx*0.16,-ry*0.7);
      cx.lineTo(s*rx*0.22-Math.sin(time*5+s)*3,-ry*1.65);
      cx.stroke();
    }
  }else{
    cx.beginPath();
    cx.moveTo(-rx*0.3,-ry*0.8);
    cx.quadraticCurveTo(0,-ry*1.45,rx*0.28,-ry*0.8);
    cx.closePath();cx.fill();
  }

  // 3. Main 3D-Shaded Body
  const grad=cx.createLinearGradient(0,-ry,0,ry);
  grad.addColorStop(0,c1);
  grad.addColorStop(0.55,c2);
  grad.addColorStop(1,'#ffffff');
  cx.fillStyle=grad;

  cx.beginPath();
  if(id==='shark'||id==='hammerhead'){
    cx.moveTo(rx*1.12,ry*0.05);
    cx.quadraticCurveTo(rx*0.5,-ry*1.05,-rx*0.95,-ry*0.38);
    cx.lineTo(-rx*0.95,ry*0.38);
    cx.quadraticCurveTo(rx*0.45,ry*1.02,rx*1.12,ry*0.05);
  }else{
    cx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  }
  cx.fill();

  cx.strokeStyle='rgba(0,0,0,0.22)';
  cx.lineWidth=1.2;
  cx.stroke();

  // 4. Specular 3D Highlight Sheen
  cx.fillStyle='rgba(255,255,255,0.34)';
  cx.beginPath();
  cx.ellipse(rx*0.08,-ry*0.38,rx*0.65,ry*0.22,0,0,Math.PI*2);
  cx.fill();

  // 5. Species-Specific Anatomical Markings
  if(id==='sword'||id==='marlin'){
    cx.fillStyle=c1;
    cx.beginPath();
    cx.moveTo(rx*0.88,-ry*0.14);
    cx.lineTo(rx*1.9,0);
    cx.lineTo(rx*0.88,ry*0.14);
    cx.closePath();cx.fill();
  }else if(id==='hammerhead'){
    cx.fillStyle=c1;
    cx.fillRect(rx*0.82,-ry*0.75,rx*0.26,ry*1.5);
  }else if(id==='angler'){
    cx.strokeStyle='#cbd5e1';cx.lineWidth=1.6*scaleMult;
    cx.beginPath();cx.moveTo(rx*0.4,-ry*0.75);cx.quadraticCurveTo(rx*1.15,-ry*1.3,rx*1.3,-ry*0.25);cx.stroke();
    cx.fillStyle='#fde047';
    cx.beginPath();cx.arc(rx*1.3,-ry*0.22,4.5*scaleMult,0,Math.PI*2);cx.fill();
  }else if(id==='orca'){
    cx.fillStyle='#ffffff';
    cx.beginPath();cx.ellipse(rx*0.58,-ry*0.22,rx*0.2,ry*0.14,0,0,Math.PI*2);cx.fill();
  }else if(id==='tang'){
    cx.strokeStyle='#09090b';cx.lineWidth=3.5*scaleMult;
    cx.beginPath();cx.ellipse(-rx*0.05,-ry*0.1,rx*0.48,ry*0.35,0,0,Math.PI);cx.stroke();
  }else if(id==='butterfly'){
    cx.fillStyle='#09090b';
    cx.fillRect(rx*0.42,-ry*0.75,rx*0.14,ry*1.5);
    cx.beginPath();cx.arc(-rx*0.55,-ry*0.2,baseR*0.22,0,Math.PI*2);cx.fill();
  }else if(id==='clown'){
    [-0.42,0.02,0.44].forEach(pos=>{
      cx.fillStyle='#ffffff';
      cx.strokeStyle='#111827';
      cx.lineWidth=1.5*scaleMult;
      cx.beginPath();
      cx.roundRect(rx*pos-rx*0.07,-ry*0.88,rx*0.14,ry*1.76,4);
      cx.fill();cx.stroke();
    });
  }else if(id==='mack'||id==='tilapia'){
    cx.strokeStyle='rgba(15,23,42,0.65)';
    cx.lineWidth=1.8*scaleMult;
    for(let k=-4;k<=3;k++){
      cx.beginPath();
      cx.moveTo(k*rx*0.18,-ry*0.85);
      cx.quadraticCurveTo(k*rx*0.18+3,-ry*0.35,k*rx*0.18-2,-ry*0.05);
      cx.stroke();
    }
  }else if(id==='lion'){
    cx.fillStyle='rgba(127,29,29,0.72)';
    for(let k=-3;k<=3;k++){
      cx.fillRect(k*rx*0.22-2,-ry*0.82,4*scaleMult,ry*1.64);
    }
  }else if(id==='bream'){
    cx.strokeStyle='#fbbf24';
    cx.lineWidth=2.5*scaleMult;
    cx.beginPath();
    cx.moveTo(rx*0.52,-ry*0.55);cx.lineTo(rx*0.68,-ry*0.15);
    cx.stroke();
  }else if(id==='cod'||id==='grouper'){
    cx.fillStyle='rgba(55,40,20,0.32)';
    for(let s=-3;s<=2;s++){
      cx.beginPath();cx.arc(s*rx*0.22,-ry*0.25,baseR*0.14,0,Math.PI*2);cx.fill();
    }
  }else if(id==='tuna'){
    cx.fillStyle='#facc15';
    for(let k=1;k<=4;k++){
      cx.fillRect(-rx*0.42-k*rx*0.11,-ry*0.45,3*scaleMult,3*scaleMult);
      cx.fillRect(-rx*0.42-k*rx*0.11,ry*0.35,3*scaleMult,3*scaleMult);
    }
  }else if(id==='shark'){
    cx.strokeStyle='rgba(15,23,42,0.6)';
    cx.lineWidth=1.4*scaleMult;
    for(let g=0;g<5;g++){
      cx.beginPath();
      cx.moveTo(rx*0.28+g*3.5*scaleMult,-ry*0.18);
      cx.lineTo(rx*0.26+g*3.5*scaleMult,ry*0.24);
      cx.stroke();
    }
  }

  // 6. Animated Pectoral Fin
  cx.save();
  cx.translate(rx*0.22,ry*0.22);
  cx.rotate(Math.sin(time*6)*0.3);
  cx.fillStyle=c1;
  cx.beginPath();
  cx.moveTo(0,0);
  cx.lineTo(-baseR*0.55,baseR*0.48);
  cx.lineTo(-baseR*0.15,baseR*0.52);
  cx.closePath();cx.fill();
  cx.restore();

  // 7. 3D Eye with Specular Glint
  const ex=rx*0.58,ey=-ry*0.18,er=Math.max(2.6,baseR*0.2);
  cx.fillStyle='#ffffff';
  cx.beginPath();cx.arc(ex,ey,er,0,Math.PI*2);cx.fill();
  cx.fillStyle='#0f172a';
  cx.beginPath();cx.arc(ex+er*0.22,ey,er*0.55,0,Math.PI*2);cx.fill();
  cx.fillStyle='#ffffff';
  cx.beginPath();cx.arc(ex+er*0.35,ey-er*0.25,er*0.22,0,Math.PI*2);cx.fill();

  cx.restore();
}

/* ---------- 4 Boats + Caught Fish Inside Boat + 9 Rods ---------- */
function drawBoatAndFisherman(surfY,time){
  const b=BOATS[S.boat];
  const bx=175,bw=195;

  cx.save();
  const bob=Math.sin(time*2.2)*2.2;
  cx.translate(0,bob);

  // Caught fish resting visibly inside the boat deck well
  const deckFish=S.deck.slice(-b[2]);
  deckFish.forEach((fid,idx)=>{
    const f=F.find(x=>x[0]===fid);
    if(!f)return;
    const col=idx%4,row=Math.floor(idx/4);
    const fx=bx+36+col*34+(row*8);
    const fy=surfY-10-row*9;
    drawFish3D(f,fx,fy,idx%2===0?1:-1,0.42,0);
  });

  if(S.boat===0){
    cx.fillStyle=b[3];
    cx.beginPath();
    cx.moveTo(bx,surfY-14);cx.lineTo(bx+bw,surfY-14);
    cx.lineTo(bx+bw-24,surfY+14);cx.lineTo(bx+20,surfY+14);
    cx.closePath();cx.fill();
    cx.strokeStyle=b[4];cx.lineWidth=2.5;cx.stroke();
    cx.fillStyle=b[5];cx.fillRect(bx+28,surfY-16,16,5);
  }else if(S.boat===1){
    cx.fillStyle=b[3];
    cx.beginPath();
    cx.moveTo(bx-10,surfY-16);cx.lineTo(bx+bw+16,surfY-20);
    cx.lineTo(bx+bw-16,surfY+14);cx.lineTo(bx+14,surfY+14);
    cx.closePath();cx.fill();
    cx.fillStyle=b[4];
    cx.beginPath();
    cx.moveTo(bx-2,surfY-6);cx.lineTo(bx+bw+8,surfY-8);
    cx.lineTo(bx+bw,surfY+2);cx.lineTo(bx+6,surfY+2);
    cx.closePath();cx.fill();
    cx.fillStyle=b[5];
    cx.beginPath();cx.moveTo(bx+115,surfY-18);cx.lineTo(bx+142,surfY-34);cx.lineTo(bx+152,surfY-18);cx.closePath();cx.fill();
  }else if(S.boat===2){
    cx.fillStyle=b[3];
    cx.beginPath();
    cx.moveTo(bx-20,surfY-18);cx.lineTo(bx+bw+24,surfY-22);
    cx.lineTo(bx+bw-14,surfY+16);cx.lineTo(bx+10,surfY+16);
    cx.closePath();cx.fill();
    cx.fillStyle=b[4];cx.fillRect(bx-6,surfY-6,bw+18,8);
    cx.fillStyle='#f1f5f9';cx.fillRect(bx+18,surfY-44,82,26);
    cx.fillStyle=b[4];cx.fillRect(bx+26,surfY-38,18,12);cx.fillRect(bx+52,surfY-38,18,12);
    cx.fillStyle=b[5];cx.fillRect(bx+14,surfY-47,90,4);
  }else{
    cx.fillStyle=b[3];
    cx.beginPath();
    cx.moveTo(bx-26,surfY-20);cx.lineTo(bx+bw+30,surfY-24);
    cx.lineTo(bx+bw-12,surfY+18);cx.lineTo(bx+8,surfY+18);
    cx.closePath();cx.fill();
    cx.strokeStyle=b[5];cx.lineWidth=3;cx.stroke();
    cx.fillStyle=b[4];cx.fillRect(bx+14,surfY-50,86,30);
    cx.fillStyle=b[5];cx.fillRect(bx+22,surfY-42,16,12);cx.fillRect(bx+46,surfY-42,16,12);cx.fillRect(bx+70,surfY-42,16,12);
    cx.fillRect(bx+48,surfY-68,5,18);
    cx.beginPath();cx.arc(bx+50,surfY-70,6,0,Math.PI*2);cx.fill();
  }

  const fx=bx+bw-22,fy=surfY-16;
  cx.fillStyle='#f4c28b';cx.beginPath();cx.arc(fx,fy-20,8.5,0,Math.PI*2);cx.fill();
  cx.fillStyle='#0f172a';cx.fillRect(fx-9,fy-28,18,4);cx.fillStyle='#fff';cx.fillRect(fx-6,fy-32,12,4);
  cx.fillStyle='#0284c7';cx.fillRect(fx-8,fy-11,16,13);

  const rod=RODS[S.rod];
  const tipX=hx,tipY=surfY-68-S.rod*2.5;
  if(S.rod>=7){
    cx.shadowColor=rod[5];
    cx.shadowBlur=14;
  }
  cx.strokeStyle=rod[4];
  cx.lineWidth=2.6+S.rod*0.42;
  cx.beginPath();
  cx.moveTo(fx+4,fy-6);
  cx.quadraticCurveTo((fx+tipX)*0.5,tipY-8,tipX,tipY);
  cx.stroke();

  cx.strokeStyle=rod[5];
  cx.lineWidth=1.4;
  cx.beginPath();
  cx.moveTo(fx+18,fy-14);
  cx.lineTo(tipX,tipY);
  cx.stroke();
  cx.shadowBlur=0;

  if(S.rod===8){
    cx.strokeStyle='#00f5d4';cx.lineWidth=2;
    cx.beginPath();
    cx.moveTo(tipX-5,tipY-6);cx.lineTo(tipX,tipY);cx.lineTo(tipX+5,tipY-6);
    cx.stroke();
  }

  cx.restore();
  return{tipX,tipY:tipY+bob};
}

/* ---------- Main Animation Loop ---------- */
function loop(){
  requestAnimationFrame(loop);
  if(cv.offsetParent===null)return;
  const W=720,H=410,now=Date.now()/1000;

  const PX_PER_M=3.2;
  const activeDepthM=ph==='idle'?S.targetDepth:Math.max(5,(hy-SURFACE_Y)/PX_PER_M);
  const desiredDepth=Math.max(0,activeDepthM-35);
  const targetCamY=desiredDepth*PX_PER_M;
  camY+=(targetCamY-camY)*0.08;

  /* Dynamic Ocean Expansion: deeper depth widens the underwater field of view */
  const depthFactor=Math.min(1,Math.max(0,(activeDepthM-5)/495));
  const targetZoom=1-depthFactor*0.36;
  seaZoom+=(targetZoom-seaZoom)*0.06;
  const visW=W/seaZoom;
  const visLeft=hx-hx/seaZoom;
  const visRight=visLeft+visW;

  cx.clearRect(0,0,W,H);
  cx.save();
  cx.translate(hx,H*0.5);
  cx.scale(seaZoom,seaZoom);
  cx.translate(-hx,-H*0.5);

  const surfScreenY=SURFACE_Y-camY;
  const padTop=-H/seaZoom,padBot=H*1.6/seaZoom;
  if(surfScreenY>padTop){
    const skyG=cx.createLinearGradient(0,padTop,0,surfScreenY);
    skyG.addColorStop(0,'#7dd3fc');
    skyG.addColorStop(1,'#e0f2fe');
    cx.fillStyle=skyG;
    cx.fillRect(visLeft-40,padTop,visW+80,surfScreenY-padTop);
  }

  const waterTop=Math.max(padTop,surfScreenY);
  const depthRatio=Math.min(1,camY/(500*PX_PER_M));
  const wg=cx.createLinearGradient(0,waterTop,0,padBot);
  if(depthRatio<0.25){
    wg.addColorStop(0,'#0ea5e9');
    wg.addColorStop(1,'#0369a1');
  }else if(depthRatio<0.6){
    wg.addColorStop(0,'#0369a1');
    wg.addColorStop(1,'#1e1b4b');
  }else{
    wg.addColorStop(0,'#1e1b4b');
    wg.addColorStop(1,'#020617');
  }
  cx.fillStyle=wg;
  cx.fillRect(visLeft-40,waterTop,visW+80,padBot-waterTop);

  /* Distant Deep-Sea Canyon & Reef Silhouettes that widen with depth */
  if(depthFactor>0.12){
    cx.fillStyle='rgba(2,6,23,'+(0.18+depthFactor*0.25)+')';
    cx.beginPath();
    cx.moveTo(visLeft-40,padBot);
    cx.lineTo(visLeft-40,H*0.62);
    cx.quadraticCurveTo(visLeft+90,H*0.42,visLeft+170,padBot);
    cx.fill();
    cx.beginPath();
    cx.moveTo(visRight+40,padBot);
    cx.lineTo(visRight+40,H*0.58);
    cx.quadraticCurveTo(visRight-100,H*0.38,visRight-180,padBot);
    cx.fill();
  }

  if(surfScreenY>-220){
    cx.fillStyle='rgba(255,255,255,0.07)';
    for(let r=0;r<6;r++){
      cx.beginPath();
      cx.moveTo(visLeft+90+r*165,Math.max(padTop,surfScreenY));
      cx.lineTo(visLeft+20+r*165,padBot);
      cx.lineTo(visLeft+160+r*165,padBot);
      cx.closePath();cx.fill();
    }
  }

  if(surfScreenY>padTop-20&&surfScreenY<padBot+20){
    cx.fillStyle='rgba(255,255,255,0.35)';
    cx.beginPath();
    cx.moveTo(visLeft-40,surfScreenY);
    for(let x=visLeft-40;x<=visRight+40;x+=14)cx.lineTo(x,surfScreenY+Math.sin(x/28+now*3)*3.5);
    cx.lineTo(visRight+40,surfScreenY+10);cx.lineTo(visLeft-40,surfScreenY+10);cx.fill();
  }

  cx.fillStyle='rgba(255,255,255,0.5)';
  cx.font='bold 12px system-ui';
  cx.textAlign='left';
  for(let dm=20;dm<=500;dm+=20){
    const my=SURFACE_Y+dm*PX_PER_M-camY;
    if(my>padTop+14&&my<padBot-10){
      cx.fillRect(visLeft+6,my,16,1.5);
      cx.fillText(dm+'m',visLeft+26,my+4);
    }
  }

  if(Math.random()<0.1)bb.push({x:visLeft+Math.random()*visW,y:camY+padBot,r:1.8+Math.random()*3});
  cx.strokeStyle='rgba(255,255,255,0.35)';
  bb.forEach(b=>{
    b.y-=0.9;
    const sy=b.y-camY;
    if(sy>surfScreenY&&sy<padBot){cx.beginPath();cx.arc(b.x,sy,b.r,0,Math.PI*2);cx.stroke();}
  });
  bb=bb.filter(b=>b.y>SURFACE_Y);

  bgFish.forEach(o=>{
    o.x+=o.d*o.s;
    if(o.x>visRight+140)o.x=visLeft-140;
    if(o.x<visLeft-140)o.x=visRight+140;
    const sy=SURFACE_Y+o.depth*PX_PER_M-camY;
    if(sy>padTop-70&&sy<padBot+70){
      drawFish3D(o.f,o.x,sy,o.d,0.75,now+o.phase);
      if(hasAcc('sonar')){
        cx.fillStyle='rgba(134,239,172,0.9)';
        cx.font='600 10px system-ui';
        cx.textAlign='center';
        cx.fillText(fname(o.f)+' · '+o.f[3]+'kg',o.x,sy-22);
      }
    }
  });

  let tip={tipX:hx,tipY:surfScreenY-65};
  if(surfScreenY>padTop-110){
    tip=drawBoatAndFisherman(surfScreenY,now);
  }

  const targetHookY=SURFACE_Y+S.targetDepth*PX_PER_M;
  const speedMult=hasAcc('reel')||S.rod===5?1.85:1;

  if(ph==='idle'){
    hy+=(SURFACE_Y-8-hy)*0.15;
  }else if(ph==='down'){
    hy+=3.6*speedMult;
    if(hy>=targetHookY){
      hy=targetHookY;
      ph='wait';
      const chosen=pickTargetFish(S.targetDepth);
      const fromLeft=Math.random()<0.5;
      tgt={f:chosen,x:fromLeft?visLeft-90:visRight+90,y:hy+15,d:fromLeft?1:-1};
    }
  }else if(ph==='wait'){
    tgt.d=tgt.x<hx?1:-1;
    tgt.x+=tgt.d*2.5;
    tgt.y+=(hy-tgt.y)*0.07;
    if(Math.abs(tgt.x-hx)<18){
      if(tgt.f[3]>effMaxWeight()){
        const heavyFish=tgt.f;
        ph='flee';tgt.d=-tgt.d;
        sfx('bad');
        msg('⚖️ <b>'+esc(fname(heavyFish))+' ('+heavyFish[3]+' kg)</b><br>'+t('tooHeavy'));
      }else if(tgt.f[7]>0){
        let dmg=tgt.f[7];
        if(S.rod===3||S.rod===7)dmg=Math.max(1,dmg-1);
        S.hookHp=Math.max(0,S.hookHp-dmg);
        save();syncDepthUI();
        if(S.hookHp<=0){
          S.hook=0;S.hookHp=1;
          save();syncDepthUI();
          ph='flee';tgt.d=-tgt.d;
          sfx('snap');
          msg(t('hookBroke'));
        }else{
          ph='quiz';
          sfx('bite');
          banner=t('predWarn')+' (-'+dmg+')';bannerT=120;
          setTimeout(()=>{
            const nq=nextQ();
            if(nq.q)showQ(nq.q);
            else{ph='idle';tgt=null;msg(t(nq.e));}
          },320);
        }
      }else{
        ph='quiz';
        sfx('bite');
        setTimeout(()=>{
          const nq=nextQ();
          if(nq.q)showQ(nq.q);
          else{ph='idle';tgt=null;msg(t(nq.e));}
        },320);
      }
    }
  }else if(ph==='reeling'){
    hy-=5.2*speedMult;
    if(tgt){tgt.x=hx;tgt.y=hy+8;}
    if(hy<=SURFACE_Y-10){
      landFishInBoat(tgt.f);
    }
  }else if(ph==='flee'){
    hy+=(SURFACE_Y-8-hy)*0.12;
    if(tgt){
      tgt.x+=tgt.d*5.6;
      if(tgt.x<visLeft-160||tgt.x>visRight+160){tgt=null;ph='idle';}
    }else ph='idle';
  }

  const hookScreenY=hy-camY;
  const lineTopY=surfScreenY>padTop-110?tip.tipY:padTop;
  cx.strokeStyle='rgba(255,255,255,0.85)';
  cx.lineWidth=hasAcc('kevlar')?2.2:1.4;
  cx.beginPath();
  cx.moveTo(hx,lineTopY);
  cx.lineTo(hx,hookScreenY);
  cx.stroke();

  if(hasAcc('light')&&hookScreenY>surfScreenY){
    const lg=cx.createRadialGradient(hx,hookScreenY,4,hx,hookScreenY,145);
    lg.addColorStop(0,'rgba(52,211,153,0.45)');
    lg.addColorStop(1,'rgba(52,211,153,0)');
    cx.fillStyle=lg;
    cx.beginPath();cx.arc(hx,hookScreenY,145,0,Math.PI*2);cx.fill();
  }

  cx.strokeStyle=HOOKS[S.hook][3];
  cx.lineWidth=2.6;
  cx.beginPath();
  cx.arc(hx-3,hookScreenY+4,5,0,Math.PI*1.25);
  cx.stroke();

  if(tgt){
    const ty=tgt.y-camY;
    drawFish3D(tgt.f,tgt.x,ty,ph==='reeling'?1:tgt.d,1.08,now);
    if(hasAcc('sonar')){
      cx.fillStyle='#fde047';
      cx.font='bold 11px system-ui';
      cx.textAlign='center';
      cx.fillText('📡 '+fname(tgt.f)+' ('+tgt.f[3]+' kg)',tgt.x,ty-30);
    }
  }

  cx.restore(); // End world-space zoom transform; draw fixed screen-space HUD overlays

  if(hasAcc('sonar')){
    const rx=W-62,ry=62,rr=46;
    cx.save();
    cx.fillStyle='rgba(6,24,44,0.78)';
    cx.strokeStyle='#22c55e';cx.lineWidth=2;
    cx.beginPath();cx.arc(rx,ry,rr,0,Math.PI*2);cx.fill();cx.stroke();
    const ang=(now*2.5)%(Math.PI*2);
    cx.strokeStyle='rgba(34,197,94,0.65)';
    cx.beginPath();cx.moveTo(rx,ry);cx.lineTo(rx+Math.cos(ang)*rr,ry+Math.sin(ang)*rr);cx.stroke();
    bgFish.slice(0,10).forEach((o,idx)=>{
      const bx2=rx+Math.cos(idx*0.9+o.x*0.01)*28;
      const by2=ry+Math.sin(idx*0.9+o.depth*0.02)*28;
      cx.fillStyle='#4ade80';
      cx.beginPath();cx.arc(bx2,by2,2.4,0,Math.PI*2);cx.fill();
    });
    if(tgt){
      cx.fillStyle='#fbbf24';
      cx.beginPath();cx.arc(rx,ry,4,0,Math.PI*2);cx.fill();
    }
    cx.restore();
  }

  if(bannerT>0){
    bannerT--;
    cx.save();
    cx.fillStyle='rgba(15,23,42,0.82)';
    cx.beginPath();cx.roundRect(W/2-155,14,310,34,14);cx.fill();
    cx.fillStyle='#fde047';cx.font='bold 14px system-ui';cx.textAlign='center';
    cx.fillText(banner,W/2,36);
    cx.restore();
  }

  $('#hint').textContent=
    ph==='wait'?t('wt'):
    ph==='reeling'?t('rlng'):'';
}

apply();
loop();
</script>
</body>
</html>
